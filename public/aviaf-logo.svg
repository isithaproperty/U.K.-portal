  <!-- stylised elephant -->
  <g fill="#111" stroke="#c7932d" stroke-width="2.2" filter="url(#soft)">
    <path d="M145 150c7-28 24-48 49-59 24-11 52-10 74 3 13 8 23 19 31 31 6 9 14 12 21 8 9-5 11-18 10-30 9 9 13 22 10 35-3 14-12 25-25 31-10 4-20 5-30 2l-13-4c-9-3-18-2-25 3-12 9-18 23-20 39l-5 34h-24l4-39c1-12-2-23-8-32-7-10-19-16-31-15-12 1-22 7-29 17-6 8-10 19-11 29l-4 40h-24l4-42c1-15 5-30 12-44 7-13 18-23 34-27z"/>
