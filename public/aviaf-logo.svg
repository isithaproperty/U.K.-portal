<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-labelledby="title desc">
<title id="title">AVIAF Asset Management</title>
<desc id="desc">AVIAF Asset Management black and gold elephant logo with Latin and English mottos</desc>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8f6417"/>
    <stop offset=".28" stop-color="#e0b64d"/>
    <stop offset=".55" stop-color="#b87c17"/>
    <stop offset=".8" stop-color="#f0cb65"/>
    <stop offset="1" stop-color="#8a5a11"/>
  </linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".18"/>
  </filter>
</defs>

<g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
