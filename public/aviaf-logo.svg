  <line x1="92" y1="210" x2="328" y2="210" stroke="url(#gold)" stroke-width="2.5"/>

  <text x="210" y="251" font-size="46" font-weight="700" letter-spacing="6" fill="#111" stroke="#b98522" stroke-width=".7">AVIAF</text>
  <line x1="55" y1="266" x2="105" y2="266" stroke="url(#gold)" stroke-width="2"/>
  <line x1="315" y1="266" x2="365" y2="266" stroke="url(#gold)" stroke-width="2"/>
  <text x="210" y="269" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="5" fill="#24201b">ASSET MANAGEMENT</text>
  <text x="210" y="291" font-style="italic" font-size="14" fill="#1c1814">I will either find a way, or make one</text>
